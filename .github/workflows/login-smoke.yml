name: Verify published participant login

on:
  workflow_run:
    workflows: ["Deploy NEXUS Control Tower to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  browser-smoke-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify public site accepts a participant
        run: node tests/login-smoke.mjs
